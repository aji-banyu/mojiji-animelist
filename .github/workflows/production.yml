name: Production Pipeline (Build, Backup & Release)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-frontend:
    name: Build Frontend (Next.js Static Export)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Next.js Production Static Site
        working-directory: ./apps/web
        env:
          NEXT_PUBLIC_TENRAI_BASE_URL: https://api.tenrai.org/v1
          NEXT_PUBLIC_APP_ENV: production
          NEXT_PUBLIC_USE_MOCK: "false"
          NEXT_PUBLIC_API_URL: https://mojiji.web.id
        run: |
          npm ci
          npm run build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-prod
          path: ./apps/web/out/

  build-backend:
    name: Build & Push Backend Images (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Images
        run: |
          touch .env
          docker compose -f infra/compose/docker-compose.prod.yml build
          docker compose -f infra/compose/docker-compose.prod.yml push

  transfer-to-vps:
    name: Transfer Release Files to VPS
    needs: [build-frontend, build-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build-prod
          path: frontend-build-prod/

      - name: Transfer Files to VPS via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST_VPS }}
          username: ${{ secrets.USERNAME_VPS }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 20125
          source: "infra/, frontend-build-prod/, database/"
          target: "/home/${{ secrets.USERNAME_VPS }}/mojiji-production"

  deploy:
    name: Execute Production Deployment & Rollout
    needs: transfer-to-vps
    runs-on: ubuntu-latest
    steps:
      - name: Execute Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST_VPS }}
          username: ${{ secrets.USERNAME_VPS }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 20125
          script_stop: true
          script: |
            set -e

            cd /home/${{ secrets.USERNAME_VPS }}/mojiji-production

            # 1. Siapkan folder pencatatan backup otomatis
            mkdir -p backups

            # 2. Tulis berkas konfigurasi rahasia produksi (.env)
            cat << 'ENVFILE' > .env
            APP_ENV=production
            NODE_ENV=production
            DATABASE_URL="${{ secrets.PROD_DATABASE_URL }}"
            REDIS_URL="${{ secrets.PROD_REDIS_URL || secrets.STAGING_REDIS_URL }}"
            REDIS_KEY_PREFIX=mojiji_prod:
            TENRAI_BASE_URL=https://api.tenrai.org/v1
            JWT_SECRET="${{ secrets.PROD_JWT_SECRET || secrets.STAGING_JWT_SECRET }}"
            INTERNAL_KEY="${{ secrets.PROD_INTERNAL_KEY || 'mojiji-internal-key-prod' }}"
            COOKIE_NAME=mj_session
            PORT_GATEWAY=5000
            PORT_USER=5001
            PORT_CATALOG=5002
            PORT_TRACKER=5003
            ENVFILE

            chmod 600 .env

            # 3. Sinkronkan berkas statis frontend Next.js produksi ke direktori Caddy
            echo "Menyinkronkan berkas frontend produksi ke /srv/production..."
            mkdir -p /home/${{ secrets.USERNAME_VPS }}/mojiji-staging/frontend-build/production
            cp -r frontend-build-prod/* /home/${{ secrets.USERNAME_VPS }}/mojiji-staging/frontend-build/production/

            # 4. Pull image backend production terbaru dari GHCR
            echo "Mengunduh image kontainer backend produksi dari GHCR..."
            docker compose --env-file .env -f infra/compose/docker-compose.prod.yml pull api-gateway user-service catalog-service tracker-service

            # 5. Pre-migration backup & migrasi skema database production otomatis
            if [ -n "${{ secrets.PROD_DATABASE_URL }}" ]; then
              echo "Melakukan backup data production sebelum migrasi..."
              TIMESTAMP=$(date +%Y%m%d_%H%M%S)
              docker run --rm -e DATABASE_URL="${{ secrets.PROD_DATABASE_URL }}" postgres:16-alpine pg_dump "$DATABASE_URL" > "backups/mojiji_prod_backup_${TIMESTAMP}.sql" 2>/dev/null || true

              echo "Menjalankan migrasi database production (dbmate up)..."
              docker compose --env-file .env -f infra/compose/docker-compose.prod.yml run --rm -e DATABASE_URL="${{ secrets.PROD_DATABASE_URL }}" migrate --migrations-dir /db/migrations up
            else
              echo "⚠️ Peringatan: PROD_DATABASE_URL belum terisi di GitHub Secrets. Melewati tahap migrasi database (menunggu tiket MJ-101 Ryan)."
            fi

            # 6. Menjalankan kontainer microservices produksi (Project: mojiji-prod)
            echo "Menjalankan kontainer microservices produksi (port 5000-5003)..."
            docker compose -p mojiji-prod --env-file .env -f infra/compose/docker-compose.prod.yml up -d --remove-orphans api-gateway user-service catalog-service tracker-service

            # 7. Memuat ulang konfigurasi Caddy (zero-downtime)
            echo "Memuat ulang Caddy Reverse Proxy untuk domain mojiji.web.id..."
            docker exec mojiji_caddy_server_staging caddy reload --config /etc/caddy/Caddyfile 2>/dev/null || true

            # 8. Pemeriksaan kesehatan (Healthcheck)
            echo "Pemeriksaan kesehatan API Gateway Production..."
            sleep 5
            docker compose -p mojiji-prod ps
            curl -fsS http://localhost:5000/health || echo "Peringatan: Gateway production lokal belum merespons di port 5000"

            echo ""
            echo "============================================================"
            echo "✅ Deployment Production Selesai!"
            echo "🌐 URL Publik: https://mojiji.web.id"
            echo "============================================================"
