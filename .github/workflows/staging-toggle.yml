name: Staging Environment Toggle (ON / OFF)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Aksi kontrol lingkungan staging'
        required: true
        default: 'UP'
        type: choice
        options:
          - UP
          - DOWN

jobs:
  toggle-staging:
    name: Toggle Staging (${{ inputs.action }})
    runs-on: ubuntu-latest
    steps:
      - name: Execute Staging Control via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST_VPS }}
          username: ${{ secrets.USERNAME_VPS }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT_VPS || 21185 }}
          command_timeout: 5m
          script: |
            echo "=================================================="
            echo " [MOJIJI OPS] Kontrol Staging Toggle (${{ inputs.action }})"
            echo "=================================================="

            if [ "${{ inputs.action }}" = "DOWN" ]; then
              echo "Mendeteksi kontainer backend staging yang sedang aktif..."
              CONTAINERS_TO_STOP=$(docker ps --filter "name=_staging" --format "{{.Names}}" | grep -v "caddy" || true)

              if [ -n "$CONTAINERS_TO_STOP" ]; then
                echo "Menghentikan kontainer: $CONTAINERS_TO_STOP"
                docker stop -t 2 $CONTAINERS_TO_STOP 2>/dev/null || docker kill $CONTAINERS_TO_STOP 2>/dev/null || true
              else
                echo "Seluruh kontainer backend staging sudah dalam kondisi mati."
              fi
            else
              echo "Menyalakan seluruh container staging..."
              STAGING_DIR="/home/${{ secrets.USERNAME_VPS }}/mojiji-staging"
              if [ ! -d "$STAGING_DIR" ]; then
                echo "❌ Error: Direktori $STAGING_DIR tidak ditemukan di VPS!"
                exit 1
              fi
              cd "$STAGING_DIR"

              # Deteksi seluruh service di compose secara dinamis (otomatis kecualikan kontainer migrate)
              SERVICES_TO_START=$(docker compose --env-file .env -f infra/compose/docker-compose.server.yml config --services 2>/dev/null | grep -v -E '^migrate$' || true)

              # Siapkan folder dummy secara dinamis untuk setiap service yang terdeteksi
              for svc in $SERVICES_TO_START; do
                mkdir -p "services/$svc" 2>/dev/null || true
              done

              if [ -n "$SERVICES_TO_START" ]; then
                echo "Menjalankan service: $SERVICES_TO_START"
                docker compose --env-file .env -f infra/compose/docker-compose.server.yml up -d --remove-orphans $SERVICES_TO_START || true
              else
                echo "Menjalankan seluruh service staging..."
                docker compose --env-file .env -f infra/compose/docker-compose.server.yml up -d --remove-orphans || true
              fi

              docker exec mojiji_caddy_server_staging caddy reload --config /etc/caddy/Caddyfile 2>/dev/null || true
            fi

            echo ""
            echo "=================================================="
            echo " Status Kontainer Staging Terkini:"
            echo "=================================================="
            docker ps --filter "name=_staging" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            echo ""
            echo "=================================================="
            echo " Pemakaian Memori Bebas Host (RAM Dihemat):"
            echo "=================================================="
            free -m || true
            echo ""
            echo "✅ Operasi ${{ inputs.action }} pada staging selesai."
