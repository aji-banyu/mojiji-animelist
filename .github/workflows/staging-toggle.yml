name: Staging Environment Toggle (ON / OFF)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Aksi kontrol lingkungan staging'
        required: true
        default: 'UP'
        type: choice
        options:
          - UP
          - DOWN

jobs:
  toggle-staging:
    name: Toggle Staging (${{ inputs.action }})
    runs-on: ubuntu-latest
    steps:
      - name: Execute Staging Control via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST_VPS }}
          username: ${{ secrets.USERNAME_VPS }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT_VPS || 21185 }}
          command_timeout: 5m
          script_stop: true
          script: |
            set -e

            STAGING_DIR="/home/${{ secrets.USERNAME_VPS }}/mojiji-staging"
            if [ ! -d "$STAGING_DIR" ]; then
              echo "❌ Error: Direktori $STAGING_DIR tidak ditemukan di VPS!"
              echo "Pastikan alur deployment staging sudah dijalankan minimal 1 kali."
              exit 1
            fi

            cd "$STAGING_DIR"

            # Bersihkan karakter baris Windows (\r / CRLF) menggunakan tr agar 100% kompatibel dengan Linux
            for f in infra/scripts/*.sh; do
              if [ -f "$f" ]; then
                tr -d '\r' < "$f" > "$f.tmp" && mv "$f.tmp" "$f" || true
              fi
            done
            chmod +x infra/scripts/*.sh || true

            if [ "${{ inputs.action }}" = "UP" ]; then
              echo "Menyalakan seluruh container staging..."
              bash ./infra/scripts/staging-up.sh
            else
              echo "Mematikan backend staging (menghemat RAM VPS)..."
              bash ./infra/scripts/staging-down.sh
            fi
