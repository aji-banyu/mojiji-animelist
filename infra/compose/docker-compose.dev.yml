version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: mojiji_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-mojiji}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: mojiji_redis
    ports:
      - "6379:6379"

  user-service:
    build:
      context: ../../services/user-service
      dockerfile: Dockerfile
    container_name: mojiji_user_service
    ports:
      - "4001:4001"
    environment:
      - PORT=4001
      - DB_HOST=db
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-mojiji}
      - DB_PORT=5432
    depends_on:
      - db
      - redis

volumes:
  pgdata:
