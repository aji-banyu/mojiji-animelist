services:
  migrate:
    image: amacneil/dbmate
    container_name: mojiji_migrate_server_${APP_ENV:-production}
    volumes:
      - ../../database/migrations:/db/migrations
    environment:
      DATABASE_URL: ${DATABASE_URL}

  api-gateway:
    build:
      context: ../../services/api-gateway
    image: ghcr.io/aji-banyu/mojiji-api-gateway:${TAG:-latest}
    container_name: mojiji_gateway_server_${APP_ENV:-production}
    restart: unless-stopped
    mem_limit: 96m
    environment:
      APP_ENV: ${APP_ENV:-production}
      PORT: ${PORT_GATEWAY:-5000}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_KEY: ${INTERNAL_KEY}
      COOKIE_NAME: ${COOKIE_NAME:-mj_session}
      TENRAI_BASE_URL: ${TENRAI_BASE_URL:-https://api.tenrai.org/v1}
      REDIS_URL: ${REDIS_URL}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-mojiji_prod:}
      USER_SERVICE_URL: http://user-service:5001
      CATALOG_SERVICE_URL: http://catalog-service:5002
      TRACKER_SERVICE_URL: http://tracker-service:5003
      NODE_OPTIONS: "--max-old-space-size=64"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      retries: 3

  user-service:
    build:
      context: ../../services/user-service
    image: ghcr.io/aji-banyu/mojiji-user-service:${TAG:-latest}
    container_name: mojiji_user_server_${APP_ENV:-production}
    restart: unless-stopped
    mem_limit: 96m
    environment:
      APP_ENV: ${APP_ENV:-production}
      PORT: ${PORT_USER:-5001}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_KEY: ${INTERNAL_KEY}
      COOKIE_NAME: ${COOKIE_NAME:-mj_session}
      REDIS_URL: ${REDIS_URL}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-mojiji_prod:}
      NODE_OPTIONS: "--max-old-space-size=64"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5001/health"]
      interval: 30s
      retries: 3

  catalog-service:
    build:
      context: ../../services/catalog-service
    image: ghcr.io/aji-banyu/mojiji-catalog-service:${TAG:-latest}
    container_name: mojiji_catalog_server_${APP_ENV:-production}
    restart: unless-stopped
    mem_limit: 96m
    environment:
      APP_ENV: ${APP_ENV:-production}
      PORT: ${PORT_CATALOG:-5002}
      DATABASE_URL: ${DATABASE_URL}
      INTERNAL_KEY: ${INTERNAL_KEY}
      TENRAI_BASE_URL: ${TENRAI_BASE_URL:-https://api.tenrai.org/v1}
      REDIS_URL: ${REDIS_URL}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-mojiji_prod:}
      NODE_OPTIONS: "--max-old-space-size=64"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5002/health"]
      interval: 30s
      retries: 3

  tracker-service:
    build:
      context: ../../services/tracker-service
    image: ghcr.io/aji-banyu/mojiji-tracker-service:${TAG:-latest}
    container_name: mojiji_tracker_server_${APP_ENV:-production}
    restart: unless-stopped
    mem_limit: 96m
    environment:
      APP_ENV: ${APP_ENV:-production}
      PORT: ${PORT_TRACKER:-5003}
      DATABASE_URL: ${DATABASE_URL}
      INTERNAL_KEY: ${INTERNAL_KEY}
      CATALOG_SERVICE_URL: http://catalog-service:5002
      REDIS_URL: ${REDIS_URL}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-mojiji_prod:}
      NODE_OPTIONS: "--max-old-space-size=64"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5003/health"]
      interval: 30s
      retries: 3

networks:
  default:
    name: compose_default
    external: true
